<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <meta name="description" content="张浩堃，软件工程师。个人主页。">
  <title>张浩堃 — 软件工程师</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e8;
      --ink: #20231f;
      --muted: #73766d;
      --line: #d8d5ca;
      --accent: #b54832;
      --serif: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: .18;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");
    }
    .page { width: min(100% - 48px, 1080px); margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 88px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .mark { color: var(--ink); font-family: var(--serif); font-size: 17px; letter-spacing: .04em; }
    .availability { display: flex; align-items: center; gap: 9px; }
    .availability::before { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); content: ""; }
    main { position: relative; display: grid; min-height: min(690px, calc(100vh - 160px)); align-content: center; padding: 90px 0 110px; }
    .eyebrow { margin: 0 0 26px; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; font-family: var(--serif); font-size: clamp(56px, 10vw, 116px); font-weight: 400; letter-spacing: -.075em; line-height: 1.12; }
    h1 span { display: block; padding-left: clamp(24px, 8vw, 104px); }
    .intro { display: flex; align-items: flex-start; gap: 36px; margin: 44px 0 0 clamp(24px, 8vw, 104px); }
    .rule { flex: 0 0 44px; height: 1px; margin-top: 13px; background: var(--accent); }
    .intro p { max-width: 340px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.9; }
    .stamp { position: absolute; right: 2%; bottom: 13%; display: grid; width: clamp(76px, 13vw, 132px); aspect-ratio: 1; place-items: center; border: 1px solid var(--accent); border-radius: 50%; color: var(--accent); font-family: var(--serif); font-size: clamp(13px, 2vw, 19px); line-height: 1.35; text-align: center; transform: rotate(-12deg); }
    .stamp::before { position: absolute; inset: 6px; border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent); border-radius: 50%; content: ""; }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 22px 0 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .footer-note { color: var(--accent); }
    @media (max-width: 600px) {
      .page { width: min(100% - 36px, 1080px); }
      header { min-height: 70px; }
      main { min-height: calc(100svh - 140px); padding: 72px 0 105px; }
      .intro { gap: 18px; margin-top: 32px; }
      .rule { flex-basis: 26px; }
      .stamp { right: 5px; bottom: 6%; }
      footer { font-size: 10px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise .7s both; }
      main h1 { animation-delay: .08s; }
      main .intro { animation-delay: .18s; }
      main .stamp { animation-delay: .3s; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="mark">个人主页</div>
      <div class="availability">持续学习 · 持续创造</div>
    </header>
    <main>
      <p class="eyebrow">Software Engineer</p>
      <h1>张浩堃<span>你好，很高兴认识你。</span></h1>
      <div class="intro">
        <span class="rule" aria-hidden="true"></span>
        <p>软件工程师。<br>在代码与想法之间，认真做好每一件小事。</p>
      </div>
      <div class="stamp" aria-hidden="true">持续<br>构建</div>
    </main>
    <footer>
      <span>© <span id="year">2026</span> 张浩堃</span>
      <span class="footer-note">做一点有用的东西。</span>
    </footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
